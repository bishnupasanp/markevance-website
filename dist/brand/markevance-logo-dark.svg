<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 300" width="100%" height="100%">
  <defs>
    <style>
      .wordmark {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 88px;
        font-weight: 700;
        letter-spacing: 0.05em;
        fill: #F8F9FA;
      }
      .tagline {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.28em;
        fill: #C5A880;
      }
    </style>
  </defs>
  <!-- Background (Optional / Transparent by default or Sovereign Navy) -->
  <rect width="100%" height="100%" fill="#080E18" />

  <!-- Monogram -->
  <g transform="translate(40, 32) scale(1.0)">
    <polygon points="0,0 0,43 125,159 250,43 250,0 125,116" fill="#C5A880" />
    <polygon points="0,75 0,235 33,235 33,149 125,235 217,149 217,235 250,235 250,75 125,191" fill="#C5A880" />
  </g>

  <!-- Wordmark & Sub-descriptor -->
  <text x="360" y="150" class="wordmark">MARKEVANCE</text>
  <text x="365" y="225" class="tagline">GROWTH MARKETING &amp; SALES DEVELOPMENT</text>
</svg>
